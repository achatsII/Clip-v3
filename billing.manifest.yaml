# Catalogue de facturation de CLIP : ce que l'app vend, et ce que chaque plan donne.
#
# Ce fichier est la seule source du catalogue : la publication (skill billing-publish) le valide, puis
# l'écrit dans la base de facturation et chez Stripe. Les raisons de chaque valeur sont dites dans le
# compte rendu de la livraison. Un prix se corrige par une nouvelle version de plan, jamais en
# modifiant une version publiée.
manifest_version: 1

product:
  # À enregistrer à la Gateway avant la publication : l'app se connecte encore avec « html ».
  slug: clip-v3
  name: CLIP
  # Le web (Stripe) et l'app mobile (App Store et Google Play, par RevenueCat) : le champion découvre
  # CLIP dans le magasin et s'y abonne seul (VISION.md) ; l'usine peut toujours payer sur le web.
  channels: [web, ios, android]
  acquisition: [self_serve]
  is_self_service: true
  application:
    # Les routes que l'app appelle, au plus juste. Aucun assistant: : chaque appel d'IA passe par
    # une opération ci-dessous (POST /api/v2/ai/ask), débitée par la plateforme.
    default_scopes: [data:*, files:write, files:read, files:process, files:transcribe, ai:upload, ai:live, ai:generate_image]
  org_model: { on_signup: personal, team_join: none }
  default_plan_code: free
  default_overage_policy: block
  providers:
    stripe:
      enabled: true
    # Sur iPhone et Android, on vend dans le magasin (jamais par Stripe). L'acheteur, pour RevenueCat,
    # est l'organisation. La publication crée les droits et les produits chez RevenueCat (sync).
    revenuecat:
      enabled: true
      # Projet à créer à la mise en route des magasins s'il n'existe pas.
      project: clip-v3
      app_user_id_scope: organization
      posture: in_app_purchase
      store_catalog: sync
      apps:
        ios: { bundle_id: com.intelligenceindustrielle.clip }
        android: { package_name: com.intelligenceindustrielle.clip }
      iap_justification:
        reason: "Le champion découvre CLIP dans l'App Store ou Google Play et s'abonne seul (Solo) avant de convaincre son usine : une vente à une personne, donc dans le magasin (Apple 3.1.1 et 3.1.3(b), facturation de Google Play)."
        approved_by: "skill billing"
        approved_on: "2026-11-11"

features:
  # Une banque commune pour toute l'IA : chaque opération a son prix en crédits (ai_operations).
  - key: ai_credits
    kind: credit
    name: Crédits IA
    unit: credit
    overage_policy: block
  # Les quantités détenues, comptées par l'app (la plateforme ne reçoit pas encore ce compte).
  - key: published_instructions
    kind: limit
    name: Instructions publiées
    unit: instruction
    capacity_source: reported
  - key: stations
    kind: limit
    name: Postes
    unit: station
    capacity_source: reported
  # Les rédacteurs et approbateurs ; les lecteurs et les opérateurs ne sont jamais comptés.
  - key: editors
    kind: limit
    name: Rédacteurs
    unit: editor
    capacity_source: reported
  - key: translations
    kind: boolean
    name: Traduction pour les opérateurs
  - key: adoption_stats
    kind: boolean
    name: Statistiques d'adoption et retour sur investissement
  - key: approvals
    kind: boolean
    name: Approbation avant publication
  - key: bulk_import
    kind: boolean
    name: Import en lot
  - key: voice_assistant
    kind: boolean
    name: Assistant vocal au poste
  - key: brand_kit
    kind: boolean
    name: Logo et couleurs de l'usine
  - key: full_export
    kind: boolean
    name: Export complet
  # Les blocs communs : des étapes rédigées une fois, réutilisées dans plusieurs instructions et
  # mises à jour partout. Utile dès qu'une bibliothèque grandit : Équipe et Usine.
  - key: shared_blocks
    kind: boolean
    name: Blocs communs
  # Les modules en option (plus bas, kind: addon) : aucun plan de base ne les donne.
  - key: academy
    kind: boolean
    name: Académie
  - key: records_plus
    kind: boolean
    name: Relevés avancés

plans:
  # Un produit de magasin par prix, store_product_id = clip_v3_<plan>_<intervalle>_v<version> : les
  # magasins n'acceptent que minuscules, chiffres, « _ » et « . », d'où clip_v3 pour le slug clip-v3.
  # Un produit ne se réécrit pas : chaque nouvelle version vendue en prend de nouveaux. Le droit
  # RevenueCat du plan (store_entitlement) reste le même pour toutes ses versions.
  #
  # La grille suit la valeur : les postes (la couverture du plancher), les rédacteurs (la capacité de
  # création) et les instructions publiées. Les opérateurs et les lecteurs ne se comptent jamais.
  # Les banques de crédits suivent l'usage réel d'un profil type (en crédits), avec de la marge ;
  # au-delà, on monte de plan. Le support humain se paie : il est inclus là où le prix le couvre.

  # Gratuit : goûter la boucle (capture, génération, poste, retours), pas vivre dessus.
  # 300 crédits : environ deux petites générations par mois.
  - code: free
    kind: base
    name: Gratuit
    version: 1
    status: active
    sort_order: 10
    # Montré comme plan courant dans l'app ; rien à acheter.
    availability: { channels: [web, ios, android], audience: personal }
    entitlements:
      features: { translations: false, adoption_stats: false, approvals: false, bulk_import: false, voice_assistant: false, brand_kit: false, full_export: false, shared_blocks: false, academy: false, records_plus: false }
      limits: { published_instructions: 3, stations: 1, editors: 1 }
      credits:
        - { feature: ai_credits, amount: 300, period: monthly, rollover: none }

  # Solo : le champion qui documente son propre travail ; ses statistiques l'aident à convaincre
  # son usine de passer à Équipe.
  - code: solo
    kind: base
    name: Solo
    version: 1
    status: active
    sort_order: 20
    availability: { channels: [web, ios, android], audience: personal, store_entitlement: clip-v3.solo }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 4900, store_product_id: clip_v3_solo_monthly_v1 }
      - { interval: yearly, currency: CAD, amount_cents: 49000, store_product_id: clip_v3_solo_yearly_v1 }
    entitlements:
      features: { translations: false, adoption_stats: true, approvals: false, bulk_import: false, voice_assistant: false, brand_kit: false, full_export: false, shared_blocks: false, academy: false, records_plus: false }
      limits: { published_instructions: 30, stations: 5, editors: 1 }
      credits:
        - { feature: ai_credits, amount: 2500, period: monthly, rollover: none }

  # Équipe : un atelier ou une petite usine, le plan mis en avant.
  - code: equipe
    kind: base
    name: Équipe
    version: 1
    status: active
    sort_order: 30
    availability: { channels: [web, ios, android], audience: personal, store_entitlement: clip-v3.equipe }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 29900, store_product_id: clip_v3_equipe_monthly_v1 }
      - { interval: yearly, currency: CAD, amount_cents: 299000, store_product_id: clip_v3_equipe_yearly_v1 }
    entitlements:
      features: { translations: true, adoption_stats: true, approvals: true, bulk_import: false, voice_assistant: false, brand_kit: true, full_export: false, shared_blocks: true, academy: false, records_plus: false }
      limits: { published_instructions: null, stations: 25, editors: 5 }
      credits:
        - { feature: ai_credits, amount: 12000, period: monthly, rollover: none }

  # Usine : toute l'usine, tout compris, support prioritaire et démarrage accompagné à l'annuel.
  - code: usine
    kind: base
    name: Usine
    version: 1
    status: active
    sort_order: 40
    availability: { channels: [web, ios, android], audience: personal, store_entitlement: clip-v3.usine }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 89900, store_product_id: clip_v3_usine_monthly_v1 }
      - { interval: yearly, currency: CAD, amount_cents: 899000, store_product_id: clip_v3_usine_yearly_v1 }
    entitlements:
      features: { translations: true, adoption_stats: true, approvals: true, bulk_import: true, voice_assistant: true, brand_kit: true, full_export: true, shared_blocks: true, academy: false, records_plus: false }
      limits: { published_instructions: null, stations: 100, editors: 15 }
      credits:
        - { feature: ai_credits, amount: 40000, period: monthly, rollover: none }

  # ── LES MODULES EN OPTION ──────────────────────────────────────────────────────────────────────
  # Un module s'ajoute à Équipe ou à Usine quand l'usine en a besoin : l'Académie (former et garder
  # chaque personne qualifiée) et les Relevés (des données fiables du plancher). Sur le web seulement :
  # un module ne se vend pas dans les magasins. 14 jours offerts, une fois par organisation. Annuel =
  # 10 mois. Son prix suit le plan de base (Usine : trois fois Équipe, comme ses postes et ses
  # rédacteurs) : un module par plan de base, <module>_<plan>. Le manifeste n'a pas de champ documenté
  # pour ce rattachement : l'app ne propose que le module de son plan (MODULES, dans
  # src/lib/billing/catalog.ts). La simulation de billing-publish le confirme avant la publication.
  - code: academie_equipe
    kind: addon
    name: Académie
    version: 1
    status: active
    trial_days: 14
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 14900 }
      - { interval: yearly, currency: CAD, amount_cents: 149000 }
    entitlements:
      features: { academy: true }

  - code: academie_usine
    kind: addon
    name: Académie
    version: 1
    status: active
    trial_days: 14
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 44900 }
      - { interval: yearly, currency: CAD, amount_cents: 449000 }
    entitlements:
      features: { academy: true }

  - code: releves_equipe
    kind: addon
    name: Relevés
    version: 1
    status: active
    trial_days: 14
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 9900 }
      - { interval: yearly, currency: CAD, amount_cents: 99000 }
    entitlements:
      features: { records_plus: true }

  - code: releves_usine
    kind: addon
    name: Relevés
    version: 1
    status: active
    trial_days: 14
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 29900 }
      - { interval: yearly, currency: CAD, amount_cents: 299000 }
    entitlements:
      features: { records_plus: true }

# Une ligne par appel à l'assistant d'Octopus. Les générations ont une opération par taille de lot :
# l'app choisit d'après la durée de vidéo, le nombre de photos et de pages. Le prix d'une génération
# couvre aussi la transcription des notes vocales et les vignettes qu'elle déclenche.
ai_operations:
  - { key: generate_s, capability: assistant.ask, feature: ai_credits, credits: 150, provider: google, level: mid }
  - { key: generate_m, capability: assistant.ask, feature: ai_credits, credits: 300, provider: google, level: mid }
  - { key: generate_l, capability: assistant.ask, feature: ai_credits, credits: 750, provider: google, level: mid }
  - { key: import_s, capability: assistant.ask, feature: ai_credits, credits: 60, provider: google, level: mid }
  - { key: import_l, capability: assistant.ask, feature: ai_credits, credits: 120, provider: google, level: mid }
  - { key: step_assist, capability: assistant.ask, feature: ai_credits, credits: 5, provider: google, level: mid }
  # Traduire une instruction : ses textes, les annotations, les légendes et le texte des schémas.
  - { key: translate, capability: assistant.ask, feature: ai_credits, credits: 30, provider: google, level: mid }
  # Refaire une image avec son texte traduit (option, non cochée par défaut) : lire et traduire le
  # texte de l'image, et couvrir la génération d'image qui suit, comme une illustration.
  - { key: translate_image, capability: assistant.ask, feature: ai_credits, credits: 70, provider: google, level: mid }
  - { key: annotate, capability: assistant.ask, feature: ai_credits, credits: 5, provider: google, level: mid }
  # Prépare l'illustration et couvre la génération d'image qui suit.
  - { key: illustrate, capability: assistant.ask, feature: ai_credits, credits: 70, provider: google, level: mid }
  - { key: ask_question, capability: assistant.ask, feature: ai_credits, credits: 2, provider: google, level: low }
  - { key: standard_agent, capability: assistant.ask, feature: ai_credits, credits: 5, provider: google, level: mid }
  # Un échange avec l'assistant d'édition : il lit l'instruction et rend les modifications à faire.
  - { key: edit_agent, capability: assistant.ask, feature: ai_credits, credits: 20, provider: google, level: mid }
  # Un schéma généré : une page HTML autonome (SVG, dessin, vue 3D).
  - { key: visual, capability: assistant.ask, feature: ai_credits, credits: 60, provider: google, level: mid }
  # L'assistant d'édition revoit des sources d'origine, seulement quand la demande l'exige : un
  # deuxième tour avec les médias joints (vidéo en basse définition, réponse courte). Une opération
  # par taille, mêmes seuils que la génération ; environ 40 % du prix d'une génération de même taille.
  - { key: look_s, capability: assistant.ask, feature: ai_credits, credits: 60, provider: google, level: mid }
  - { key: look_m, capability: assistant.ask, feature: ai_credits, credits: 120, provider: google, level: mid }
  - { key: look_l, capability: assistant.ask, feature: ai_credits, credits: 300, provider: google, level: mid }
  # Les questions de formation d'une instruction (3 à 5) : lire l'instruction et écrire les questions.
  - { key: quiz, capability: assistant.ask, feature: ai_credits, credits: 10, provider: google, level: mid }
