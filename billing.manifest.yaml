# Catalogue de facturation de CLIP : ce que l'app vend, et ce que chaque plan donne.
#
# Ce fichier est la seule source du catalogue : la publication (skill billing-publish) le valide, puis
# l'écrit dans la base de facturation et chez Stripe. Les raisons de chaque valeur sont dites dans le
# compte rendu de la livraison. Un prix se corrige par une nouvelle version de plan, jamais en
# modifiant une version publiée.
manifest_version: 1

product:
  # À enregistrer à la Gateway avant la publication : l'app se connecte encore avec « html ».
  slug: clip-v3
  name: CLIP
  # Le web seulement (Stripe), décision du 2026-11-17 : on s'abonne sur le site, une seule facturation.
  # L'app mobile est une app compagnon : elle ne vend rien (ni prix, ni bouton, ni lien d'achat) et ouvre
  # ce que l'organisation a acheté sur le web. Si Apple exige l'achat dans l'app (règle 3.1.3(b)),
  # la version suivante du manifeste ajoutera ios et android, providers.revenuecat (posture
  # in_app_purchase, projet clip-v3, apps com.intelligenceindustrielle.clip) et les store_product_id
  # des prix : le code de l'app sait déjà vendre dans le magasin (toggle storePurchases).
  channels: [web]
  acquisition: [self_serve]
  is_self_service: true
  application:
    # Les routes que l'app appelle, au plus juste. assistant:ask : chaque appel d'IA part sur
    # /api/v4/assistant/ask avec le jeton du compte, puis l'app débite son coût réel (consume).
    # ai:job : la génération au serveur (Job_start, branche clip-v3).
    default_scopes: [data:*, files:write, files:read, files:process, files:transcribe, ai:upload, ai:live, ai:generate_image, ai:job, assistant:ask]
  # L'IA FACTURÉE AU COÛT RÉEL : le débit d'une réponse lancée ne refuse jamais, même sous zéro ; c'est la
  # réponse suivante qui est refusée tant que le solde est à zéro ou en dessous. Vaut pour toute feature à
  # crédits du produit (CLIP n'en a qu'une, ai_credits).
  enforce_denial: false
  org_model: { on_signup: personal, team_join: none }
  # Sans abonnement : pas d'IA (pas de crédits offerts sans fin). On essaie Solo ou Équipe 7 jours.
  default_plan_code: free
  default_overage_policy: block
  providers:
    stripe:
      enabled: true

features:
  # Une banque commune pour toute l'IA : chaque réponse est débitée de son coût réel, converti en
  # crédits une fois terminée (le taux se règle hors du dépôt). Aucun prix fixe, rien ne se prédit.
  - key: ai_credits
    kind: credit
    name: Crédits IA
    unit: credit
    overage_policy: block
  # Les quantités détenues, comptées par l'app (la plateforme ne reçoit pas encore ce compte).
  - key: published_instructions
    kind: limit
    name: Instructions publiées
    unit: instruction
    capacity_source: reported
  - key: stations
    kind: limit
    name: Postes
    unit: station
    capacity_source: reported
  # Les rédacteurs et approbateurs ; les lecteurs et les opérateurs ne sont jamais comptés.
  - key: editors
    kind: limit
    name: Rédacteurs
    unit: editor
    capacity_source: reported
  - key: translations
    kind: boolean
    name: Traduction pour les opérateurs
  - key: adoption_stats
    kind: boolean
    name: Statistiques d'adoption et retour sur investissement
  - key: approvals
    kind: boolean
    name: Approbation avant publication
  - key: bulk_import
    kind: boolean
    name: Import en lot
  - key: voice_assistant
    kind: boolean
    name: Assistant vocal au poste
  - key: brand_kit
    kind: boolean
    name: Logo et couleurs de l'usine
  - key: full_export
    kind: boolean
    name: Export complet
  # Les blocs communs : des étapes rédigées une fois, réutilisées dans plusieurs instructions et
  # mises à jour partout. Utile dès qu'une bibliothèque grandit : Équipe et Usine.
  - key: shared_blocks
    kind: boolean
    name: Blocs communs
  # Enregistrer l'écran d'un ordinateur (un logiciel, clic par clic), sans rien installer : la vidéo,
  # une image nette à chaque action, et l'IA en fait une étape par clic. Dès Solo : le champion qui
  # documente son ERP ou son MES ne doit pas partir chez un outil de captures d'écran.
  - key: screen_capture
    kind: boolean
    name: Enregistrement de l'écran
  # L'IA qui apprend des corrections de toute l'équipe : règles proposées pour l'usine, analyse par
  # l'IA, instructions modèles de l'usine. Les préférences de chacun restent ouvertes à tous les plans.
  - key: ai_learning
    kind: boolean
    name: L'IA apprend de toute l'équipe
  # Les modules en option (plus bas, kind: addon) : aucun plan de base ne les donne.
  - key: academy
    kind: boolean
    name: Académie
  - key: records_plus
    kind: boolean
    name: Relevés avancés

plans:
  # La grille suit la valeur : les postes (la couverture du plancher), les rédacteurs (la capacité de
  # création) et les instructions publiées. Les opérateurs et les lecteurs ne se comptent jamais.
  #
  # LE VOLUME : plus on monte, moins chaque unité coûte. Équipe donne 5 fois les quantités de Solo
  # (postes, rédacteurs, instructions, crédits) pour 4 fois le prix : chaque poste, rédacteur,
  # instruction et crédit y revient environ 20 % moins cher, en plus des fonctions d'équipe. Usine
  # descend encore, au contrat. La durée : l'annuel vaut 10 mois ; 3 et 5 ans, au contrat d'Usine.
  #
  # En libre-service (le site), seulement des forfaits d'entrée, tous plafonnés : rien d'illimité,
  # rien qu'une usine entière pourrait utiliser. Toute l'usine passe par l'équipe de CLIP : Usine n'a
  # aucun prix, ne s'achète nulle part et s'attribue à l'organisation après la vente.
  #
  # L'ESSAI (décision du 2026-11-17) : plus de forfait gratuit avec des crédits (l'IA a un coût réel) ;
  # Solo et Équipe s'essaient 7 jours, une fois par organisation (Stripe l'applique au paiement).
  #
  # Crédits et limites concordent : une génération coûte en réalité 16 à 55 crédits (mesuré en QA,
  # novembre 2026, vidéo courte ou moyenne), environ 150 pour 30 minutes de vidéo. Chaque banque
  # permet d'atteindre la limite d'instructions du plan même avec de longues vidéos, retouches comprises :
  # c'est la limite d'instructions qui arrête, pas les crédits.
  # Sans abonnement : le plan d'une organisation qui n'a pas (ou plus) d'abonnement. Aucune IA (la
  # feature ai_credits n'y est pas : la génération ouvre la fenêtre des forfaits et leur essai). Ce qui
  # est publié reste lisible au poste ; on ne peut pas dépasser ses petites limites.
  - code: free
    kind: base
    name: Sans abonnement
    version: 1
    status: active
    sort_order: 10
    # Montré comme plan courant dans l'app ; rien à acheter.
    availability: { channels: [web], audience: personal }
    entitlements:
      features: { translations: false, adoption_stats: false, approvals: false, bulk_import: false, voice_assistant: false, brand_kit: false, full_export: false, shared_blocks: false, screen_capture: false, ai_learning: false, academy: false, records_plus: false }
      limits: { published_instructions: 3, stations: 1, editors: 1 }
  # Solo : le champion qui documente son propre travail ; ses statistiques l'aident à convaincre
  # son usine. 15 instructions et 3 postes : un poste ou une cellule, pas une ligne entière.
  # 49 $ : sous les outils de documentation par créateur (Guidde, Scribe, Tango : 13 à 59 $ US par
  # mois), avec le poste et la tablette en plus.
  - code: solo
    kind: base
    name: Solo
    version: 1
    status: active
    sort_order: 20
    trial_days: 7
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 4900 }
      - { interval: yearly, currency: CAD, amount_cents: 49000 }
    entitlements:
      features: { translations: false, adoption_stats: true, approvals: false, bulk_import: false, voice_assistant: false, brand_kit: false, full_export: false, shared_blocks: false, screen_capture: true, ai_learning: false, academy: false, records_plus: false }
      limits: { published_instructions: 15, stations: 3, editors: 1 }
      credits:
        - { feature: ai_credits, amount: 2500, period: monthly, rollover: none }

  # Équipe : une équipe sur une ligne ou un secteur, le plan mis en avant. 5 rédacteurs,
  # 75 instructions, 15 postes, 12 500 crédits : 5 fois Solo pour 4 fois le prix. On y vit un pilote
  # complet (approbation, traduction, blocs communs, l'IA qui apprend de l'équipe), pas une usine.
  # 199 $ : environ 40 $ par rédacteur, comme les offres d'équipe plafonnées des outils de
  # documentation (Guidde Business : 39 à 59 $ US par créateur, 5 au plus, puis sur devis).
  - code: equipe
    kind: base
    name: Équipe
    version: 1
    status: active
    sort_order: 30
    trial_days: 7
    availability: { channels: [web], audience: personal }
    prices:
      - { interval: monthly, currency: CAD, amount_cents: 19900 }
      - { interval: yearly, currency: CAD, amount_cents: 199000 }
    entitlements:
      features: { translations: true, adoption_stats: true, approvals: true, bulk_import: false, voice_assistant: false, brand_kit: true, full_export: false, shared_blocks: true, screen_capture: true, ai_learning: true, academy: false, records_plus: false }
      limits: { published_instructions: 75, stations: 15, editors: 5 }
      credits:
        - { feature: ai_credits, amount: 12500, period: monthly, rollover: none }

  # Usine : toute l'usine, sur devis. Aucun prix : il ne s'achète nulle part ; l'équipe de CLIP l'attribue à l'organisation une fois la vente faite (prix au contrat).
  # Ses droits sont ceux d'une usine : l'app les ouvre dès qu'il est attribué.
  - code: usine
    kind: base
    name: Usine
    version: 1
    status: active
    sort_order: 40
    availability: { channels: [web], audience: personal }
    entitlements:
      features: { translations: true, adoption_stats: true, approvals: true, bulk_import: true, voice_assistant: true, brand_kit: true, full_export: true, shared_blocks: true, screen_capture: true, ai_learning: true, academy: false, records_plus: false }
      limits: { published_instructions: null, stations: 100, editors: 15 }
      credits:
        - { feature: ai_credits, amount: 40000, period: monthly, rollover: none }

  # ── LES MODULES EN OPTION ──────────────────────────────────────────────────────────────────────
  # L'Académie (former et garder chaque personne qualifiée) et les Relevés (des données fiables du
  # plancher) s'ajoutent à Usine, sur devis comme elle : aucun prix, l'équipe de CLIP les attribue
  # (une fois par abonnement, max_quantity: 1). Le manifeste n'a pas de champ documenté pour le
  # rattachement au plan de base : l'app ne propose que le module de son plan (MODULES, dans
  # src/lib/billing/catalog.ts).
  - code: academie-usine
    kind: addon
    name: Académie
    version: 1
    status: active
    max_quantity: 1
    availability: { channels: [web], audience: personal }
    entitlements:
      features: { academy: true }

  - code: releves-usine
    kind: addon
    name: Relevés
    version: 1
    status: active
    max_quantity: 1
    availability: { channels: [web], audience: personal }
    entitlements:
      features: { records_plus: true }

# PAS DE SECTION ai_operations : l'IA n'a pas de prix fixe. Chaque réponse est débitée de son coût réel
# (ai_credits, plus haut) ; la publication désactive les opérations retirées.
