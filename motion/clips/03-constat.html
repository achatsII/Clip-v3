<title>03 20 à 30 % d’ici 2030</title>
<style>
.shd{position:absolute;left:-960px;top:-540px;width:1920px;height:1080px;background:linear-gradient(180deg,rgba(10,15,24,.62),rgba(10,15,24,.78))}
.stat{left:-640px;top:-250px;width:1280px;text-align:center;font-size:210px;line-height:1;background:linear-gradient(135deg,#FF5A7E,#FF8A2B);-webkit-background-clip:text;background-clip:text;color:transparent}
.stl{position:absolute;left:-640px;top:-10px;width:1280px;text-align:center;font-family:'Inter',system-ui,sans-serif;font-size:46px;font-weight:900;letter-spacing:-.03em;color:#fff}
.tl{position:absolute;left:-420px;top:110px;width:840px}
.tl .bar{position:relative;height:16px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tl .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:99px;background:linear-gradient(90deg,#FFC800,#FF6B00,#FF2B5E);transform-origin:0 50%}
.tl .y{display:flex;justify-content:space-between;margin-top:14px;font-family:'Inter',system-ui,sans-serif;font-size:22px;font-weight:900;letter-spacing:.08em;color:rgba(255,255,255,.75)}
.tl .y b{color:#FF5A7E}
</style>
<div data-slot="shape">
  <div class="L" id="Lv"></div>
  <div class="L" id="Lov">
    <i class="shd" id="sh"></i>
    <div class="big2 stat" id="st"><span id="a">0</span> à <span id="b">0</span>&#8239;%</div>
    <p class="stl" id="sl">des technologues partiront à la retraite</p>
    <div class="tl" id="tl"><div class="bar"><i id="bi"></i></div><div class="y"><span>AUJOURD’HUI</span><b>2030</b></div></div>
  </div>
</div><!--/shape-->
<style data-include="_shared.css"></style>
<script data-include="_shared.js"></script>
<script>
useChips();
const {T,W}=scene();
$('Lv').innerHTML=VIDEO('v','assets/c3-usine.webm','assets/c3-usine.jpg');
const t30=W('v03','2030')-0.05, tV=W('v03','vingt')-0.05, tT=W('v03','trente')-0.05, tTech=W('v03','technologues')-0.1, tPar=W('v03','partiront');
const ca=M.track(0,[[tV,20,[9,1]]]), cb=M.track(0,[[tT,30,[9,1]]]);
M.scene({
  W:1920,H:1080,bg:'#0f172a',center:CENTER,T,intro:null,
  SH:{bleed:SH_BLEED}, start:'bleed', SEQ:[],
  layers:[
    {el:'Lv',tin:null,tout:null,update:(t,g)=>{fitPhoto($('v'),g,1.02+0.04*M.eio(t/5)); syncVideo($('v'),t,{rate:0.82});}},
    {el:'Lov',tin:null,tout:null,update:(t)=>{
      $('sh').style.opacity=(0.35+0.65*M.clamp((t-t30+0.3)/0.6)).toFixed(3);
      M.rise($('tl'),t,t30,null,{dy:16,lin:0.3});
      $('bi').style.transform=`scaleX(${(0.04+0.96*M.eio((t-t30)/(tPar+0.6-t30))).toFixed(4)})`;
      M.rise($('st'),t,tV-0.08,null,{dy:24,lin:0.28});
      M.setText($('a'),String(Math.round(M.clamp(ca(t),0,20)))); M.setText($('b'),String(Math.round(M.clamp(cb(t),0,30))));
      M.rise($('sl'),t,tTech,null,{dy:16,lin:0.3});
    }},
  ],
});
</script>
