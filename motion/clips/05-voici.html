<title>05 Voici Clip</title>
<style>
.lk{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:30px;white-space:nowrap}
.lk .tx small{display:block;margin-top:10px;font-family:'Inter',system-ui,sans-serif;font-size:19px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#0056d6}
.ring{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:8px solid rgba(0,198,255,.95);opacity:0}
.glow{position:absolute;left:-560px;top:-560px;width:1120px;height:1120px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,198,255,.55),rgba(0,120,255,.18) 58%,rgba(0,120,255,0));opacity:0}
.spk{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;opacity:0}
</style>
<div data-slot="world"><i class="glow" id="gl"></i><i class="ring" id="r0"></i><i class="ring" id="r1"></i><i class="ring" id="r2"></i><div id="sp"></div></div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lic"></div>
  <div class="L" id="Llk"><div class="lk"><span id="mk"></span><span class="tx"><span id="wm"></span><small>Instructions de travail · IA</small></span></div></div>
</div><!--/shape-->
<style data-include="_shared.css"></style>
<script data-include="_ui.js"></script>
<script data-include="_shared.js"></script>
<script>
const {T,W}=scene();
$('Lic').innerHTML=`<div style="position:absolute;left:-120px;top:-120px;width:240px;height:240px">${LOGO(240)}</div>`;
$('mk').innerHTML=LOGO(150); $('wm').innerHTML=WORDMARK(128);
const tV=W('v05','voici')-0.04, tC=W('v05','clip')-0.06, tL=tC+0.02, BEAT=60/124.99;
// LE DROP : la scène commence sur l'entrée franche de la musique (musique.py cale) — éclat blanc, ondes, gerbe
// d'étincelles, coup de caméra ; le logo rebondit sur le temps suivant ; « Voici » l'enfonce ; « Clip » le nomme.
const SPK=Array.from({length:20},(_,i)=>({a:i/20*Math.PI*2+0.21*(i%3), v:430+((i*97)%5)*90, s:0.55+((i*31)%4)*0.22,
  c:['#00c6ff','#0078ff','#ffffff','#9b2cfa','#38bdf8','#2c62fa'][i%6]}));
$('sp').innerHTML=SPK.map((p,i)=>`<i class="spk" id="sk${i}" style="background:${p.c};box-shadow:0 0 18px ${p.c}"></i>`).join('');
const punch=PUNCH([[0.02,0.075],[BEAT,0.025],[tL,0.04]]);
const bump=M.track(0,[[0,0.2,[60,1]],[0.07,0,[13,0.45]],[BEAT,0.06,[60,1]],[BEAT+0.05,0,[15,0.5]]]);
const fl=FLASH();
SFX([-0.05,'whoosh_long',-14],[0,'impact',-7],[0.02,'sparkle',-13],[tV+0.03,'tap',-11],
    [tL-WH,'whoosh_court',-15],[tL+0.04,'pop_haut',-11],[tL+0.06,'chime',-15]);
const ring=(el,t,t0,dur,k)=>{ const u=(t-t0)/dur; if(u<=0||u>=1){el.style.opacity=0;return;}
  el.style.opacity=((1-u)*0.95).toFixed(3); el.style.transform=`scale(${(0.8+k*M.eio(u)).toFixed(4)})`; el.style.borderWidth=(2+10*(1-u)).toFixed(2)+'px'; };
M.scene({
  W:1920,H:1080,bg:BG,center:CENTER,T,intro:null,
  SH:{icon:SH_ICON, logo:SH_LOGO}, start:'icon', SEQ:[[tL,'logo']],
  shapePress:[tV+0.05],
  geom:(t,g)=>{ g.s*=1+punch(t); g.sc*=1+bump(t); return g; },
  layers:[
    {el:'Lic',tin:null,tout:tL},
    {el:'Llk',tin:tL,tout:null,o:{lin:0.25}},
  ],
  extra:(t)=>{
    fl(t,[[0,0.9,0.45],[tL,0.25,0.3]]);
    ring($('r0'),t,0,0.9,4.2); ring($('r1'),t,0.12,1.05,5.6); ring($('r2'),t,tL,0.8,3.2);
    $('gl').style.opacity=M.clamp(0.95*Math.exp(-t/1.2)+0.3*M.pulse(t,tL+0.1,0.35)).toFixed(3);
    $('gl').style.transform=`scale(${(0.75+0.45*M.clamp(t/0.7)).toFixed(4)})`;
    SPK.forEach((p,i)=>{ const el=$('sk'+i); if(t<=0||t>1.25){el.style.opacity=0;return;}
      const r=70+p.v*(1-Math.exp(-t*3.4)); el.style.opacity=(1-M.clamp(t/1.2)).toFixed(3);
      el.style.transform=`translate(${(Math.cos(p.a)*r).toFixed(1)}px,${(Math.sin(p.a)*r).toFixed(1)}px) scale(${(p.s*(1-0.5*M.clamp(t/1.25))).toFixed(3)})`; });
  },
});
</script>
