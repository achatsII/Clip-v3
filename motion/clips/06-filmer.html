<title>06 Filmer l’expert → la caméra de Clip</title>
<div data-slot="world"><div id="w2" style="position:absolute;left:0;top:0"></div></div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lph"></div>
  <div class="L" id="Lov"></div>
  <div class="L" id="Lcam"></div>
</div><!--/shape-->
<style data-include="_shared.css"></style>
<script data-include="_ui.js"></script>
<script data-include="_ui-cam.js"></script>
<script data-include="_shared.js"></script>
<script>
useUI();
const {T,W}=scene();
$('Lph').innerHTML=PHOTO('ph','assets/filmer.jpg');
$('Lov').innerHTML=CHIP('c1','video','Mélanie filme Jacques','méthodes');
Object.assign($('c1').style,{left:'-330px',top:'-450px'});
$('Lcam').innerHTML=`<div class="ui" style="left:${-PW/2}px;top:${-PH/2}px;width:${PW}px;height:${PH}px;border-radius:62px;overflow:hidden">${ui('cam',{'live-jacques':'assets/live-jacques.jpg'})}</div>`;
$('w2').innerHTML=CHIP('c2','video','Vidéo 720p, légère','',false);
Object.assign($('c2').style,{left:'-210px',top:'350px'});
const tF=W('v06','filmez')-0.1, tC=W('v06','clip'), tTab=tC+0.2, tZoom=tTab-1.0, tTel=W('v06','telephone')-0.1;
M.scene({
  W:1920,H:1080,bg:BG,center:CENTER,T,intro:null,
  SH:{bleed:SH_BLEED, phl:SH_PHL}, start:'bleed', SEQ:[[tTab,'phl']],
  layers:[
    {el:'Lph',tin:null,tout:tTab+0.14,o:{lout:0.1,flat:'out'},update:(t,g)=>{
      const z=M.eio((t-tZoom)/1.0); M.dive($('ph'),g,ECRAN_TELEPHONE,z,{w:PW,h:PH},{push:1.0+0.04*M.eio(t/2.2)});
    }},
    {el:'Lov',tin:null,tout:tZoom+0.3,o:{lout:0.2},update:(t)=>{ M.rise($('c1'),t,tF,null,{dy:-18,lin:0.3}); }},
    {el:'Lcam',tin:tTab-0.04,tout:null,o:{din:0,lin:0.16,flat:'in'},update:(t)=>{
      M.setText($('camT'),mmss(134+Math.max(0,t-tTab)));
      const k=0.5-0.5*Math.cos(Math.max(0,t-tTab)*Math.PI*1.4); $('camStop').style.boxShadow=`0 0 0 ${(6+14*k).toFixed(1)}px rgba(255,43,94,${(0.45-0.35*k).toFixed(3)})`;
    }},
  ],
  extra:(t)=>M.rise($('c2'),t,tTel,null,{dy:18,lin:0.3}),
});
</script>
